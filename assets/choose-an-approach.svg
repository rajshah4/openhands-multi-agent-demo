<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1020" role="img" aria-labelledby="choose-an-approach-title choose-an-approach-desc">
  <title id="choose-an-approach-title">Choose an orchestration approach</title>
  <desc id="choose-an-approach-desc">If a later controller must resume the same workflow, use a durable workflow. Otherwise, use a supervised lifecycle when workers need their own conversation records, or bounded delegation when they do not.</desc>
  <defs>
    <style>
      .sans{font-family:"Avenir Next","Segoe UI",Arial,sans-serif}
      .serif{font-family:Georgia,"Times New Roman",serif;font-weight:700}
      .ink{fill:#17223a}.muted{fill:#52627a}
      .label{font-size:16px;font-weight:800;letter-spacing:1px}
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M1 1l7 3.5-7 3.5" fill="none" stroke="#34445c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1200" height="1020" fill="#f7f3ea"/>
  <rect x="0" y="0" width="14" height="1020" fill="#ff766c"/>
  <text x="58" y="61" class="sans label" fill="#426aa4">A TWO-QUESTION DECISION</text>
  <text x="58" y="113" class="serif ink" font-size="44">Which control boundary do you need?</text>
  <text x="58" y="153" class="sans muted" font-size="19">Choose by recovery first, then by worker identity.</text>

  <rect x="205" y="194" width="790" height="108" rx="16" fill="#17223a"/>
  <circle cx="251" cy="248" r="23" fill="#ff766c"/>
  <text x="251" y="255" text-anchor="middle" class="sans" fill="#fff" font-size="20" font-weight="800">1</text>
  <text x="293" y="239" class="sans" fill="#fff" font-size="25" font-weight="700">Must a later controller resume this workflow</text>
  <text x="293" y="271" class="sans" fill="#fff" font-size="25" font-weight="700">after this run ends?</text>

  <path d="M600 302v59H325v42" fill="none" stroke="#34445c" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M600 361h280v42" fill="none" stroke="#34445c" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="261" y="338" width="128" height="37" rx="18" fill="#dce7f7"/>
  <text x="325" y="362" text-anchor="middle" class="sans label" fill="#315e9c">NO · BOUNDED</text>
  <rect x="817" y="338" width="126" height="37" rx="18" fill="#fff0c8"/>
  <text x="880" y="362" text-anchor="middle" class="sans label" fill="#8d6500">YES · DURABLE</text>

  <rect x="58" y="419" width="534" height="112" rx="16" fill="#fff" stroke="#aebacc" stroke-width="2"/>
  <circle cx="102" cy="475" r="23" fill="#5b8def"/>
  <text x="102" y="482" text-anchor="middle" class="sans" fill="#fff" font-size="20" font-weight="800">2</text>
  <text x="141" y="466" class="sans ink" font-size="23" font-weight="700">Do workers need their own</text>
  <text x="141" y="497" class="sans ink" font-size="23" font-weight="700">conversation records?</text>

  <path d="M325 531v82H190v27" fill="none" stroke="#34445c" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M325 613h133v27" fill="none" stroke="#34445c" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="190" y="604" text-anchor="middle" class="sans label" fill="#315e9c">NO</text>
  <text x="458" y="604" text-anchor="middle" class="sans label" fill="#21796f">YES</text>

  <rect x="58" y="654" width="250" height="255" rx="16" fill="#e8effc" stroke="#9db8e8" stroke-width="2"/>
  <text x="82" y="697" class="sans label" fill="#3f6ca9">APPROACH 1</text>
  <text x="82" y="737" class="serif ink" font-size="21">Bounded delegation</text>
  <text x="82" y="780" class="sans muted" font-size="19">Subagents work inside</text>
  <text x="82" y="808" class="sans muted" font-size="19">one parent conversation.</text>
  <text x="82" y="864" class="sans" fill="#315e9c" font-size="17" font-weight="700">TaskToolSet</text>

  <rect x="332" y="654" width="260" height="255" rx="16" fill="#e2f3ef" stroke="#95d4c9" stroke-width="2"/>
  <text x="356" y="697" class="sans label" fill="#21796f">APPROACH 2</text>
  <text x="356" y="737" class="serif ink" font-size="21">Supervised lifecycle</text>
  <text x="356" y="780" class="sans muted" font-size="19">One live supervisor;</text>
  <text x="356" y="808" class="sans muted" font-size="19">separate conversations.</text>
  <text x="356" y="864" class="sans" fill="#21796f" font-size="17" font-weight="700">Add gates as needed</text>

  <rect x="620" y="419" width="522" height="490" rx="16" fill="#fff7df" stroke="#e5c568" stroke-width="2"/>
  <text x="648" y="462" class="sans label" fill="#9a7000">APPROACH 3</text>
  <text x="648" y="503" class="serif ink" font-size="28">Durable asynchronous workflow</text>
  <text x="648" y="549" class="sans muted" font-size="19">External state carries progress across runs.</text>
  <line x1="648" y1="578" x2="1114" y2="578" stroke="#dbc787" stroke-width="2"/>

  <rect x="648" y="608" width="466" height="116" rx="12" fill="#fffdfa"/>
  <circle cx="676" cy="643" r="10" fill="#f2c14e"/>
  <text x="700" y="651" class="sans ink" font-size="22" font-weight="800">3A · Reconciliation</text>
  <text x="674" y="692" class="sans muted" font-size="18">A later tick reads state and takes the next action.</text>

  <rect x="648" y="744" width="466" height="116" rx="12" fill="#fffdfa"/>
  <circle cx="676" cy="779" r="10" fill="#ff766c"/>
  <text x="700" y="787" class="sans ink" font-size="22" font-weight="800">3B · Event handoff</text>
  <text x="674" y="828" class="sans muted" font-size="18">A stage changes the record; an event starts the next.</text>

  <text x="58" y="971" class="sans muted" font-size="18">Choose runtime placement and worker harness separately.</text>
</svg>
