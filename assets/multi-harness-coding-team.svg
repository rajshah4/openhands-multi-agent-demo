<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="team-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9" fill="none" stroke="#5b8def" stroke-width="1.4"/>
    </marker>
  </defs>

  <rect x="260" y="18" width="240" height="54" rx="9" fill="none" stroke="#5b8def" stroke-width="2"/>
  <text x="380" y="41" fill="#5b8def" font-size="16" font-weight="600" text-anchor="middle">OpenHands controller</text>
  <text x="380" y="60" fill="#8a8a8a" font-size="12" text-anchor="middle">assigns each coding phase</text>

  <rect x="40" y="132" width="200" height="72" rx="9" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="140" y="157" fill="#8a8a8a" font-size="14" font-weight="600" text-anchor="middle">implement</text>
  <text x="140" y="178" fill="#8a8a8a" font-size="12.5" text-anchor="middle">Claude Code</text>
  <text x="140" y="194" fill="#8a8a8a" font-size="11.5" text-anchor="middle">ACP or managed conversation</text>

  <rect x="280" y="132" width="200" height="72" rx="9" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="380" y="157" fill="#8a8a8a" font-size="14" font-weight="600" text-anchor="middle">test</text>
  <text x="380" y="178" fill="#8a8a8a" font-size="12.5" text-anchor="middle">Gemini CLI</text>
  <text x="380" y="194" fill="#8a8a8a" font-size="11.5" text-anchor="middle">ACP or managed conversation</text>

  <rect x="520" y="132" width="200" height="72" rx="9" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="620" y="157" fill="#8a8a8a" font-size="14" font-weight="600" text-anchor="middle">review</text>
  <text x="620" y="178" fill="#8a8a8a" font-size="12.5" text-anchor="middle">OpenHands agent</text>
  <text x="620" y="194" fill="#8a8a8a" font-size="11.5" text-anchor="middle">SDK or managed conversation</text>

  <path d="M320 72 L155 128" fill="none" stroke="#5b8def" stroke-width="1.5" marker-end="url(#team-arrow)"/>
  <path d="M380 72 L380 128" fill="none" stroke="#5b8def" stroke-width="1.5" marker-end="url(#team-arrow)"/>
  <path d="M440 72 L605 128" fill="none" stroke="#5b8def" stroke-width="1.5" marker-end="url(#team-arrow)"/>

  <rect x="130" y="250" width="500" height="46" rx="8" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="380" y="270" fill="#8a8a8a" font-size="13.5" font-weight="600" text-anchor="middle">shared coding artifacts</text>
  <text x="380" y="287" fill="#8a8a8a" font-size="11.5" text-anchor="middle">one workspace for a tight team · Git for isolated workers</text>

  <line x1="140" y1="204" x2="250" y2="246" stroke="#8a8a8a" stroke-width="1.2"/>
  <line x1="380" y1="204" x2="380" y2="246" stroke="#8a8a8a" stroke-width="1.2"/>
  <line x1="620" y1="204" x2="510" y2="246" stroke="#8a8a8a" stroke-width="1.2"/>

  <text x="380" y="316" fill="#8a8a8a" font-size="12" text-anchor="middle">Agent Canvas can display the same workers; ACP changes the harness, not the workflow</text>
</svg>
