<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9" fill="none" stroke="#8a8a8a" stroke-width="1.4"/>
    </marker>
    <marker id="arrowBlue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9" fill="none" stroke="#5b8def" stroke-width="1.4"/>
    </marker>
  </defs>

  <!-- request -->
  <text x="70" y="47" fill="#8a8a8a" font-size="14">request</text>
  <line x1="128" y1="42" x2="208" y2="42" stroke="#8a8a8a" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- parent -->
  <rect x="216" y="16" width="330" height="52" rx="8" fill="none" stroke="#5b8def" stroke-width="2"/>
  <text x="381" y="38" fill="#5b8def" font-size="15" font-weight="600" text-anchor="middle">parent orchestrator</text>
  <text x="381" y="57" fill="#8a8a8a" font-size="12.5" text-anchor="middle">stays alive from request to report</text>

  <!-- report -->
  <line x1="554" y1="42" x2="634" y2="42" stroke="#8a8a8a" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="642" y="38" fill="#8a8a8a" font-size="13.5">lifecycle</text>
  <text x="642" y="54" fill="#8a8a8a" font-size="13.5">report</text>

  <!-- children -->
  <g>
    <rect x="60" y="190" width="170" height="52" rx="8" fill="none" stroke="#8a8a8a" stroke-width="1.6"/>
    <text x="145" y="212" fill="#8a8a8a" font-size="14.5" font-weight="600" text-anchor="middle">child: plan</text>
    <text x="145" y="230" fill="#8a8a8a" font-size="12" text-anchor="middle">own conversation</text>

    <rect x="295" y="190" width="170" height="52" rx="8" fill="none" stroke="#8a8a8a" stroke-width="1.6"/>
    <text x="380" y="212" fill="#8a8a8a" font-size="14.5" font-weight="600" text-anchor="middle">child: build</text>
    <text x="380" y="230" fill="#8a8a8a" font-size="12" text-anchor="middle">own conversation</text>

    <rect x="530" y="190" width="170" height="52" rx="8" fill="none" stroke="#8a8a8a" stroke-width="1.6"/>
    <text x="615" y="212" fill="#8a8a8a" font-size="14.5" font-weight="600" text-anchor="middle">child: check</text>
    <text x="615" y="230" fill="#8a8a8a" font-size="12" text-anchor="middle">own conversation</text>
  </g>

  <!-- parent -> children (start), children -> parent (report) -->
  <line x1="290" y1="68" x2="160" y2="186" stroke="#5b8def" stroke-width="1.6" marker-end="url(#arrowBlue)"/>
  <text x="196" y="120" fill="#5b8def" font-size="12.5">1. start</text>

  <line x1="200" y1="222" x2="292" y2="222" stroke="#8a8a8a" stroke-width="1.3" stroke-dasharray="4 4" marker-end="url(#arrow)"/>

  <line x1="381" y1="68" x2="381" y2="186" stroke="#5b8def" stroke-width="1.6" marker-end="url(#arrowBlue)"/>
  <text x="389" y="120" fill="#5b8def" font-size="12.5">2. start</text>

  <line x1="435" y1="222" x2="527" y2="222" stroke="#8a8a8a" stroke-width="1.3" stroke-dasharray="4 4" marker-end="url(#arrow)"/>

  <line x1="472" y1="68" x2="602" y2="186" stroke="#5b8def" stroke-width="1.6" marker-end="url(#arrowBlue)"/>
  <text x="540" y="120" fill="#5b8def" font-size="12.5">3. start</text>

  <!-- gate note -->
  <text x="380" y="290" fill="#8a8a8a" font-size="13" text-anchor="middle">the parent waits for each child's status report and gates before starting the next</text>
  <text x="380" y="308" fill="#8a8a8a" font-size="12" text-anchor="middle" font-style="italic">status: done | needs-human | failed</text>
</svg>
