<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9" fill="none" stroke="#8a8a8a" stroke-width="1.4"/>
    </marker>
    <marker id="arrowBlue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9" fill="none" stroke="#5b8def" stroke-width="1.4"/>
    </marker>
  </defs>

  <!-- request in / report out -->
  <text x="66" y="47" fill="#8a8a8a" font-size="14">request</text>
  <line x1="124" y1="42" x2="204" y2="42" stroke="#8a8a8a" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="556" y1="42" x2="636" y2="42" stroke="#8a8a8a" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="644" y="38" fill="#8a8a8a" font-size="13.5">lifecycle</text>
  <text x="644" y="54" fill="#8a8a8a" font-size="13.5">report</text>

  <!-- parent -->
  <rect x="212" y="16" width="336" height="52" rx="8" fill="none" stroke="#5b8def" stroke-width="2"/>
  <text x="380" y="38" fill="#5b8def" font-size="15" font-weight="600" text-anchor="middle">parent orchestrator</text>
  <text x="380" y="57" fill="#8a8a8a" font-size="12.5" text-anchor="middle">stays alive from request to report</text>

  <!-- children -->
  <rect x="60" y="200" width="170" height="52" rx="8" fill="none" stroke="#8a8a8a" stroke-width="1.6"/>
  <text x="145" y="222" fill="#8a8a8a" font-size="14.5" font-weight="600" text-anchor="middle">child: plan</text>
  <text x="145" y="240" fill="#8a8a8a" font-size="12" text-anchor="middle">own conversation</text>

  <rect x="295" y="200" width="170" height="52" rx="8" fill="none" stroke="#8a8a8a" stroke-width="1.6"/>
  <text x="380" y="222" fill="#8a8a8a" font-size="14.5" font-weight="600" text-anchor="middle">child: build</text>
  <text x="380" y="240" fill="#8a8a8a" font-size="12" text-anchor="middle">own conversation</text>

  <rect x="530" y="200" width="170" height="52" rx="8" fill="none" stroke="#8a8a8a" stroke-width="1.6"/>
  <text x="615" y="222" fill="#8a8a8a" font-size="14.5" font-weight="600" text-anchor="middle">child: check</text>
  <text x="615" y="240" fill="#8a8a8a" font-size="12" text-anchor="middle">own conversation</text>

  <!-- child 1: start down, status back up -->
  <line x1="268" y1="68" x2="150" y2="196" stroke="#5b8def" stroke-width="1.6" marker-end="url(#arrowBlue)"/>
  <text x="168" y="126" fill="#5b8def" font-size="12.5">1. start</text>
  <line x1="180" y1="196" x2="298" y2="72" stroke="#8a8a8a" stroke-width="1.3" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  <text x="236" y="160" fill="#8a8a8a" font-size="11.5">status</text>

  <!-- child 2 -->
  <line x1="366" y1="68" x2="366" y2="196" stroke="#5b8def" stroke-width="1.6" marker-end="url(#arrowBlue)"/>
  <text x="318" y="126" fill="#5b8def" font-size="12.5">2. start</text>
  <line x1="396" y1="196" x2="396" y2="72" stroke="#8a8a8a" stroke-width="1.3" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  <text x="404" y="140" fill="#8a8a8a" font-size="11.5">status</text>

  <!-- child 3 -->
  <line x1="492" y1="68" x2="610" y2="196" stroke="#5b8def" stroke-width="1.6" marker-end="url(#arrowBlue)"/>
  <text x="500" y="126" fill="#5b8def" font-size="12.5">3. start</text>
  <line x1="580" y1="196" x2="462" y2="72" stroke="#8a8a8a" stroke-width="1.3" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  <text x="545" y="160" fill="#8a8a8a" font-size="11.5">status</text>

  <!-- caption -->
  <text x="380" y="296" fill="#8a8a8a" font-size="13" text-anchor="middle">every child reports back to the parent - children never talk to each other</text>
  <text x="380" y="316" fill="#8a8a8a" font-size="12" text-anchor="middle" font-style="italic">the parent starts child 2 only after child 1 reports an acceptable status</text>
</svg>
