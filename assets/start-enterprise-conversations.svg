  <text x="380" y="62" fill="#8a8a8a" font-size="12" text-anchor="middle">starts, observes, and gates</text>

  <rect x="42" y="169" width="304" height="86" rx="11" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="194" y="193" fill="#8a8a8a" font-size="13" font-weight="600" text-anchor="middle">explicit sandbox attachment</text>
  <rect x="66" y="208" width="114" height="30" rx="6" fill="none" stroke="#8a8a8a" stroke-width="1.2"/>
