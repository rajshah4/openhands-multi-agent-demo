  <text x="123" y="228" fill="#8a8a8a" font-size="11.5" text-anchor="middle">worker + sandbox</text>
  <text x="265" y="228" fill="#8a8a8a" font-size="11.5" text-anchor="middle">worker + sandbox</text>

  <rect x="414" y="169" width="304" height="86" rx="11" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="566" y="193" fill="#8a8a8a" font-size="13" font-weight="600" text-anchor="middle">configured grouping</text>
