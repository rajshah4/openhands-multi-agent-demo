  <text x="566" y="228" fill="#8a8a8a" font-size="11.5" text-anchor="middle">worker · worker · shared sandbox</text>

  <path d="M330 74 L195 165" fill="none" stroke="#5b8def" stroke-width="1.6" marker-end="url(#ent-arrow)"/>
  <path d="M430 74 L565 165" fill="none" stroke="#5b8def" stroke-width="1.6" marker-end="url(#ent-arrow)"/>
