<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="sdk-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9" fill="none" stroke="#5b8def" stroke-width="1.4"/>
    </marker>
    <marker id="sdk-return" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9" fill="none" stroke="#8a8a8a" stroke-width="1.4"/>
    </marker>
  </defs>

  <rect x="30" y="22" width="700" height="246" rx="14" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="52" y="52" fill="#8a8a8a" font-size="13">one conversation · one runtime</text>

  <rect x="245" y="72" width="270" height="58" rx="9" fill="none" stroke="#5b8def" stroke-width="2"/>
  <text x="380" y="96" fill="#5b8def" font-size="16" font-weight="600" text-anchor="middle">parent agent</text>
  <text x="380" y="116" fill="#8a8a8a" font-size="12.5" text-anchor="middle">owns the task and delegates</text>

  <rect x="72" y="194" width="170" height="50" rx="8" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="157" y="216" fill="#8a8a8a" font-size="14" font-weight="600" text-anchor="middle">research</text>
  <text x="157" y="233" fill="#8a8a8a" font-size="11.5" text-anchor="middle">subagent task</text>

  <rect x="295" y="194" width="170" height="50" rx="8" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="380" y="216" fill="#8a8a8a" font-size="14" font-weight="600" text-anchor="middle">implement</text>
  <text x="380" y="233" fill="#8a8a8a" font-size="11.5" text-anchor="middle">subagent task</text>

  <rect x="518" y="194" width="170" height="50" rx="8" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="603" y="216" fill="#8a8a8a" font-size="14" font-weight="600" text-anchor="middle">review</text>
  <text x="603" y="233" fill="#8a8a8a" font-size="11.5" text-anchor="middle">subagent task</text>

  <path d="M315 130 L176 190" fill="none" stroke="#5b8def" stroke-width="1.5" marker-end="url(#sdk-arrow)"/>
  <path d="M380 130 L380 190" fill="none" stroke="#5b8def" stroke-width="1.5" marker-end="url(#sdk-arrow)"/>
  <path d="M445 130 L584 190" fill="none" stroke="#5b8def" stroke-width="1.5" marker-end="url(#sdk-arrow)"/>

  <path d="M207 190 L332 134" fill="none" stroke="#8a8a8a" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#sdk-return)"/>
  <path d="M397 190 L397 134" fill="none" stroke="#8a8a8a" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#sdk-return)"/>
  <path d="M553 190 L428 134" fill="none" stroke="#8a8a8a" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#sdk-return)"/>

  <text x="380" y="284" fill="#8a8a8a" font-size="12.5" text-anchor="middle">separate task histories; shared filesystem, credentials, timeout, and failure boundary</text>
</svg>
