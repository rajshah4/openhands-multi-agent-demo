<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="earrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9" fill="none" stroke="#8a8a8a" stroke-width="1.4"/>
    </marker>
    <marker id="earrowOrange" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9" fill="none" stroke="#d98a4a" stroke-width="1.4"/>
    </marker>
  </defs>

  <!-- agents -->
  <rect x="55" y="50" width="165" height="52" rx="8" fill="none" stroke="#8a8a8a" stroke-width="1.6"/>
  <text x="137" y="72" fill="#8a8a8a" font-size="14.5" font-weight="600" text-anchor="middle">agent: build</text>
  <text x="137" y="90" fill="#8a8a8a" font-size="12" text-anchor="middle">finishes, then exits</text>

  <rect x="298" y="50" width="165" height="52" rx="8" fill="none" stroke="#8a8a8a" stroke-width="1.6"/>
  <text x="380" y="72" fill="#8a8a8a" font-size="14.5" font-weight="600" text-anchor="middle">agent: review</text>
  <text x="380" y="90" fill="#8a8a8a" font-size="12" text-anchor="middle">finishes, then exits</text>

  <rect x="541" y="50" width="165" height="52" rx="8" fill="none" stroke="#8a8a8a" stroke-width="1.6"/>
  <text x="623" y="72" fill="#8a8a8a" font-size="14.5" font-weight="600" text-anchor="middle">agent: QA</text>
  <text x="623" y="90" fill="#8a8a8a" font-size="12" text-anchor="middle">finishes, then exits</text>

  <!-- system of record -->
  <rect x="55" y="190" width="651" height="56" rx="8" fill="none" stroke="#d98a4a" stroke-width="2"/>
  <text x="380" y="213" fill="#d98a4a" font-size="15" font-weight="600" text-anchor="middle">system of record</text>
  <text x="380" y="232" fill="#8a8a8a" font-size="12.5" text-anchor="middle">GitHub / Jira: labels, pushes, tickets, PR events</text>

  <!-- emits / triggers -->
  <line x1="137" y1="102" x2="137" y2="186" stroke="#8a8a8a" stroke-width="1.4" marker-end="url(#earrow)"/>
  <text x="146" y="140" fill="#8a8a8a" font-size="12">emits event</text>
  <text x="146" y="156" fill="#8a8a8a" font-size="11.5" font-style="italic">push / label</text>

  <line x1="290" y1="186" x2="352" y2="106" stroke="#d98a4a" stroke-width="1.6" marker-end="url(#earrowOrange)"/>
  <text x="238" y="142" fill="#d98a4a" font-size="12">automation triggers</text>

  <line x1="380" y1="102" x2="380" y2="186" stroke="#8a8a8a" stroke-width="1.4" marker-end="url(#earrow)"/>
  <text x="389" y="140" fill="#8a8a8a" font-size="12">emits event</text>

  <line x1="533" y1="186" x2="595" y2="106" stroke="#d98a4a" stroke-width="1.6" marker-end="url(#earrowOrange)"/>
  <text x="481" y="142" fill="#d98a4a" font-size="12">automation triggers</text>

  <line x1="623" y1="102" x2="623" y2="186" stroke="#8a8a8a" stroke-width="1.4" marker-end="url(#earrow)"/>
  <text x="632" y="140" fill="#8a8a8a" font-size="12">emits event</text>

  <text x="380" y="280" fill="#8a8a8a" font-size="13" text-anchor="middle">no standing orchestrator: each finished step changes the system of record, and that change triggers the next agent</text>
</svg>
